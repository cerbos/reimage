---
name: CI
on:
  pull_request:
    branches:
      - main
      - 'v*'
permissions:
  contents: read

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
        with:
          config: ${{ vars.PERMISSIONS_CONFIG }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  test:
    name: PR test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
      with:
        config: ${{ vars.PERMISSIONS_CONFIG }}

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: true
        persist-credentials: false

    - name: Install Go
      uses: ./.github/actions/setup-go

    - name: Lint GitHub Actions
      # TODO: This fails with go tool, seemingly having issues with yaml/v4
      run: go tool -modfile=go-actionlint.mod  actionlint -verbose

    - name: golangci-lint
      run: |
        go tool -modfile=go-golangci-lint.mod golangci-lint --config=.golangci.yaml run ./...

    - name: Test
      run: go test ./...
